services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo}
      POSTGRES_DB: seo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://seo:${POSTGRES_PASSWORD:-seo}@db:5432/seo

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: &env
      SERVICE_FQDN_WEB_3000: ${SERVICE_FQDN_WEB_3000:-}
      DATABASE_URL: postgresql://seo:${POSTGRES_PASSWORD:-seo}@db:5432/seo
      TZ: ${TZ:-America/Santiago}
      BASIC_AUTH: ${BASIC_AUTH:-}
      APP_URL: ${APP_URL:-}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SERPENT_API_KEY: ${SERPENT_API_KEY:-}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      DATAFORSEO_ENV: ${DATAFORSEO_ENV:-live}
      DATAFORSEO_MODE: ${DATAFORSEO_MODE:-live}
      DATAFORSEO_QUEUE_WAIT_SECONDS: ${DATAFORSEO_QUEUE_WAIT_SECONDS:-300}
      VOLUME_PROVIDERS: ${VOLUME_PROVIDERS:-dataforseo,apify,csv}
      PROVIDER_RETRY_HOURS: ${PROVIDER_RETRY_HOURS:-6}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-s-r~google-keywords}
      APIFY_MODE: ${APIFY_MODE:-exact}
      APIFY_CONCURRENCY: ${APIFY_CONCURRENCY:-3}
      EMBEDDINGS_URL: ${EMBEDDINGS_URL:-http://embeddings:80}
      EMBEDDINGS_MODEL: paraphrase-multilingual-MiniLM-L12-v2
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      GSC_SERVICE_ACCOUNT_JSON: ${GSC_SERVICE_ACCOUNT_JSON:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      BROWSER_WS_ENDPOINT: ${BROWSER_WS_ENDPOINT:-}
      SERPENT_MONTHLY_USD: ${SERPENT_MONTHLY_USD:-3}
      LLM_MONTHLY_USD: ${LLM_MONTHLY_USD:-2}
      DATAFORSEO_MONTHLY_USD: ${DATAFORSEO_MONTHLY_USD:-1}
      APIFY_MONTHLY_USD: ${APIFY_MONTHLY_USD:-0}
      SERPENT_USD_PER_CALL: ${SERPENT_USD_PER_CALL:-0.0006}
      DATAFORSEO_USD_PER_TASK: ${DATAFORSEO_USD_PER_TASK:-0.075}
      RANK_WEEKDAY: ${RANK_WEEKDAY:-1}
      RANK_CRON: ${RANK_CRON:-0 6 * * *}
      GSC_CRON: ${GSC_CRON:-0 7 * * *}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "src/worker/index.ts"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *env

  embeddings:
    # Imagen propia con el modelo horneado en el build (ver docker/embeddings/Dockerfile).
    # Memoria medida: pico ~1,6 GiB al cargar el modelo ONNX fp32; límite con ~40% de margen.
    build: ./docker/embeddings
    image: seocheck-embeddings
    restart: unless-stopped
    mem_limit: ${EMBEDDINGS_MEM_LIMIT:-2304m}
    deploy:
      resources:
        limits:
          memory: ${EMBEDDINGS_MEM_LIMIT:-2304m}
    healthcheck:
      # la imagen no trae curl/wget: GET /health con bash + /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Render JS opcional: levanta con `--profile render` y define BROWSER_WS_ENDPOINT=ws://browser:3000?token=${BROWSER_TOKEN}
  browser:
    image: ghcr.io/browserless/chromium:latest
    profiles: ["render"]
    restart: unless-stopped
    environment:
      TOKEN: ${BROWSER_TOKEN:-seo}
      CONCURRENT: 4

volumes:
  pgdata:
